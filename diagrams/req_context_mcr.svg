<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <style>
      .ext { fill: #FFFFFF; stroke: #666666; stroke-width: 1.3; }
      .exttitle { font-size: 13.5px; font-weight: bold; fill: #1F2A44; text-anchor: middle; }
      .extsub { font-size: 10px; fill: #595959; text-anchor: middle; }
      .flow { stroke: #555555; stroke-width: 1.3; fill: none; }
      .fl { font-size: 10.5px; fill: #333333; }
      .flb { font-size: 10.5px; font-weight: bold; fill: #1F2A44; }
      .back { fill: #FFFFFF; opacity: 0.9; }
    </style>
    <marker id="arrowc" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M1,1 L9,4.5 L1,8" fill="none" stroke="#555555" stroke-width="1.3"/>
    </marker>
  </defs>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1F2A44">Context Diagram — KV 캐시 최적 운용 런타임 (MCR 1단계)</text>
  <text x="40" y="57" font-size="11" fill="#6B7A90">경계 밖 외부 엔티티와의 상호작용 — 화살표 방향 = 요청/데이터의 흐름, 굵은 글씨 = 요청·기능, 일반 글씨 = 내용물</text>

  <!-- ===== system (center) ===== -->
  <rect x="470" y="330" width="300" height="170" rx="10" fill="#1F2A44" stroke="#0F1830" stroke-width="1.5"/>
  <text x="620" y="388" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">KV 캐시 최적 운용 런타임</text>
  <text x="620" y="410" text-anchor="middle" font-size="11.5" fill="#DCE4F2">(MCR 1단계 — 시스템 경계)</text>
  <text x="620" y="436" text-anchor="middle" font-size="10" fill="#AFC0DC">제공 기능: 워크로드 서빙 · KV 재사용 · 압축(pruning)</text>
  <text x="620" y="452" text-anchor="middle" font-size="10" fill="#AFC0DC">tier 배치 · KV 인지 스케줄링 · P/D 실행 · telemetry</text>

  <!-- ===== 좌상: LLM 응용 클라이언트 ===== -->
  <rect class="ext" x="60" y="130" width="240" height="78"/>
  <text class="exttitle" x="180" y="160">LLM 응용 클라이언트</text>
  <text class="extsub" x="180" y="180">RAG · multiturn · agent 서비스</text>
  <text class="extsub" x="180" y="194">(1차 액터 — 기능을 요청)</text>
  <line class="flow" x1="300" y1="196" x2="470" y2="342" marker-end="url(#arrowc)"/>
  <line class="flow" x1="470" y1="376" x2="302" y2="226" marker-end="url(#arrowc)"/>
  <rect class="back" x="256" y="212" width="230" height="32"/>
  <text class="flb" x="262" y="224">추론 요청</text>
  <text class="fl" x="262" y="238">프롬프트·컨텍스트 · 세션/사용자 ID · SLO class</text>
  <rect class="back" x="230" y="290" width="252" height="32"/>
  <text class="flb" x="236" y="302">스트리밍 응답</text>
  <text class="fl" x="236" y="316">첫 토큰(TTFT) ~ 생성 토큰 — 품질 bound 준수</text>

  <!-- ===== 상단: 외부 Retrieval (Vector DB) ===== -->
  <rect class="ext" x="700" y="90" width="250" height="78"/>
  <text class="exttitle" x="825" y="120">Retrieval 시스템 (Vector DB)</text>
  <text class="extsub" x="825" y="140">유사도 검색 — 외부 컴포넌트 (FR-01)</text>
  <text class="extsub" x="825" y="154">(검색 가속은 2단계)</text>
  <line class="flow" x1="700" y1="168" x2="640" y2="328" marker-end="url(#arrowc)"/>
  <line class="flow" x1="690" y1="330" x2="770" y2="170" marker-end="url(#arrowc)"/>
  <rect class="back" x="742" y="196" width="152" height="32"/>
  <text class="flb" x="748" y="208">유사도 검색 질의</text>
  <text class="fl" x="748" y="222">(RAG 컨텍스트 조립용)</text>
  <rect class="back" x="440" y="242" width="216" height="32"/>
  <text class="flb" x="446" y="254">문서 chunk 반환</text>
  <text class="fl" x="446" y="268">chunk 목록 → KV 재사용 판정의 입력</text>

  <!-- ===== 우측: 메모리 tier ===== -->
  <rect class="ext" x="960" y="360" width="240" height="94"/>
  <text class="exttitle" x="1080" y="390">메모리 tier</text>
  <text class="extsub" x="1080" y="410">HBM · host DRAM · NVMe SSD (상용, C-01)</text>
  <text class="extsub" x="1080" y="424">스펙은 파라미터(대역폭·용량·지연)로만 취급</text>
  <text class="extsub" x="1080" y="438">(2단계: 자사 디바이스가 같은 자리에 plug-in)</text>
  <line class="flow" x1="770" y1="385" x2="958" y2="385" marker-end="url(#arrowc)"/>
  <line class="flow" x1="958" y1="430" x2="772" y2="430" marker-end="url(#arrowc)"/>
  <rect class="back" x="778" y="352" width="176" height="32"/>
  <text class="flb" x="784" y="364">KV 쓰기</text>
  <text class="fl" x="784" y="378">배치·강등 · pruned/압축 저장 · 영속</text>
  <rect class="back" x="778" y="436" width="176" height="32"/>
  <text class="flb" x="784" y="448">KV 읽기</text>
  <text class="fl" x="784" y="462">재사용 로드 · 복원(승격)</text>

  <!-- ===== 좌하: 운영자 ===== -->
  <rect class="ext" x="60" y="600" width="240" height="78"/>
  <text class="exttitle" x="180" y="630">운영자 (SRE)</text>
  <text class="extsub" x="180" y="650">정책 설정 · 실험 구성 운용 (1차 액터)</text>
  <line class="flow" x1="300" y1="620" x2="470" y2="470" marker-end="url(#arrowc)"/>
  <line class="flow" x1="470" y1="490" x2="302" y2="640" marker-end="url(#arrowc)"/>
  <rect class="back" x="272" y="500" width="240" height="32"/>
  <text class="flb" x="278" y="512">정책·구성 설정</text>
  <text class="fl" x="278" y="526">SLO·품질 예산 정책 · tier 구성 등록 · P/D 실험 구성</text>
  <rect class="back" x="222" y="562" width="266" height="32"/>
  <text class="flb" x="228" y="574">KV telemetry · 리포트</text>
  <text class="fl" x="228" y="588">hit rate · 압축률 분포 · tier 점유 · 벤치 결과</text>

  <!-- ===== 하단: LLM 모델 리포지토리 ===== -->
  <rect class="ext" x="700" y="620" width="250" height="78"/>
  <text class="exttitle" x="825" y="650">LLM 모델 리포지토리 (public)</text>
  <text class="extsub" x="825" y="670">Transformer 계열 — KV cache 보유 (C-02)</text>
  <text class="extsub" x="825" y="684">모델 개발·학습은 경계 외 (C-03·R-22)</text>
  <line class="flow" x1="760" y1="618" x2="668" y2="502" marker-end="url(#arrowc)"/>
  <rect class="back" x="700" y="540" width="230" height="32"/>
  <text class="flb" x="706" y="552">모델 가중치·토크나이저 로드</text>
  <text class="fl" x="706" y="566">무수정 사용 — 재학습·구조 변경 없음 (C-03)</text>

  <!-- ===== 경계 외 각주 ===== -->
  <text x="40" y="756" font-size="10.5" fill="#6B7A90">경계 외(비상호작용): 근접연산 오프로드·자사 디바이스 통합(2단계 이관) · 클러스터 규모 N 조정(고정 N 테스트베드 전제) · 모델 학습(R-22)</text>
  <text x="40" y="774" font-size="10.5" fill="#6B7A90">근거: 요구사항 분석 v1.7 §3.1 시스템 경계 · §3.2 액터 — upstream framework(vLLM)는 런타임 상호작용이 아닌 소싱 의존(DP1)이라 본 그림에서 제외</text>
</svg>
