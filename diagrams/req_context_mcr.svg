<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <style>
      .ext { fill: #FFFFFF; stroke: #666666; stroke-width: 1.3; }
      .exttitle { font-size: 13.5px; font-weight: bold; fill: #1F2A44; text-anchor: middle; }
      .extsub { font-size: 10px; fill: #595959; text-anchor: middle; }
      .flow { stroke: #555555; stroke-width: 1.3; fill: none; }
      .fl { font-size: 10.5px; fill: #333333; }
      .flb { font-size: 10.5px; font-weight: bold; fill: #1F2A44; }
      .back { fill: #FFFFFF; opacity: 0.9; }
    </style>
    <marker id="arrowc" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M1,1 L9,4.5 L1,8" fill="none" stroke="#555555" stroke-width="1.3"/>
    </marker>
  </defs>

  <text x="40" y="36" font-size="19" font-weight="700" fill="#1F2A44">Context Diagram — KV 캐시 최적 운용 런타임 (MCR 1단계)</text>
  <text x="40" y="57" font-size="11" fill="#6B7A90">경계 밖 외부 엔티티와의 상호작용 — 화살표 방향 = 요청/데이터의 흐름, 굵은 글씨 = 요청·기능, 일반 글씨 = 내용물</text>

  <!-- ===== system (center) ===== -->
  <rect x="440" y="270" width="320" height="180" rx="10" fill="#1F2A44" stroke="#0F1830" stroke-width="1.5"/>
  <text x="600" y="332" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">KV 캐시 최적 운용 런타임</text>
  <text x="600" y="354" text-anchor="middle" font-size="11.5" fill="#DCE4F2">(MCR 1단계 — 시스템 경계)</text>
  <text x="600" y="382" text-anchor="middle" font-size="10" fill="#AFC0DC">제공 기능: 워크로드 서빙 · KV 재사용 · 압축(pruning)</text>
  <text x="600" y="398" text-anchor="middle" font-size="10" fill="#AFC0DC">tier 배치 · KV 인지 스케줄링 · P/D 실행 · telemetry</text>

  <!-- ===== 좌상: LLM 응용 클라이언트 ===== -->
  <rect class="ext" x="70" y="100" width="250" height="86"/>
  <text class="exttitle" x="195" y="130">LLM 응용 클라이언트</text>
  <text class="extsub" x="195" y="150">RAG · multiturn · agent 서비스</text>
  <text class="extsub" x="195" y="164">(1차 액터 — 기능을 요청)</text>
  <line class="flow" x1="320" y1="176" x2="470" y2="268" marker-end="url(#arrowc)"/>
  <line class="flow" x1="450" y1="298" x2="322" y2="210" marker-end="url(#arrowc)"/>
  <rect class="back" x="342" y="176" width="290" height="32"/>
  <text class="flb" x="348" y="188">추론 요청</text>
  <text class="fl" x="348" y="202">프롬프트·컨텍스트(RAG chunk 포함) · 세션/사용자 ID · SLO class</text>
  <rect class="back" x="150" y="238" width="266" height="32"/>
  <text class="flb" x="156" y="250">스트리밍 응답</text>
  <text class="fl" x="156" y="264">첫 토큰(TTFT) ~ 생성 토큰 — 품질 bound 준수</text>

  <!-- ===== 우측: 메모리 tier ===== -->
  <rect class="ext" x="950" y="310" width="250" height="100"/>
  <text class="exttitle" x="1075" y="340">메모리 tier</text>
  <text class="extsub" x="1075" y="360">HBM · host DRAM · NVMe SSD (상용, C-01)</text>
  <text class="extsub" x="1075" y="374">스펙은 파라미터(대역폭·용량·지연)로만 취급</text>
  <text class="extsub" x="1075" y="388">(2단계: 자사 디바이스가 같은 자리에 plug-in)</text>
  <line class="flow" x1="760" y1="330" x2="948" y2="330" marker-end="url(#arrowc)"/>
  <line class="flow" x1="948" y1="386" x2="762" y2="386" marker-end="url(#arrowc)"/>
  <rect class="back" x="768" y="294" width="176" height="32"/>
  <text class="flb" x="774" y="306">KV 쓰기</text>
  <text class="fl" x="774" y="320">배치·강등 · pruned/압축 저장 · 영속</text>
  <rect class="back" x="768" y="392" width="176" height="32"/>
  <text class="flb" x="774" y="404">KV 읽기</text>
  <text class="fl" x="774" y="418">재사용 로드 · 복원(승격)</text>

  <!-- ===== 좌하: 운영자 ===== -->
  <rect class="ext" x="70" y="520" width="250" height="86"/>
  <text class="exttitle" x="195" y="550">운영자 (SRE)</text>
  <text class="extsub" x="195" y="570">정책 설정 · 실험 구성 운용</text>
  <text class="extsub" x="195" y="584">(1차 액터)</text>
  <line class="flow" x1="320" y1="540" x2="470" y2="430" marker-end="url(#arrowc)"/>
  <line class="flow" x1="450" y1="446" x2="322" y2="566" marker-end="url(#arrowc)"/>
  <rect class="back" x="330" y="446" width="300" height="32"/>
  <text class="flb" x="336" y="458">정책·구성 설정</text>
  <text class="fl" x="336" y="472">SLO·품질 예산 정책 · tier 구성 등록 · P/D 실험 구성</text>
  <rect class="back" x="140" y="490" width="278" height="32"/>
  <text class="flb" x="146" y="502">KV telemetry · 리포트</text>
  <text class="fl" x="146" y="516">hit rate · 압축률 분포 · tier 점유 · 벤치 결과</text>

  <!-- ===== 경계 외 각주 ===== -->
  <text x="40" y="668" font-size="10.5" fill="#6B7A90">경계 외(비상호작용): retrieval 실행(외부 컴포넌트 — 결과 chunk는 클라이언트 요청의 컨텍스트로 유입) · LLM 모델(public 제공물 로드, 무수정 — C-02·03) ·</text>
  <text x="40" y="684" font-size="10.5" fill="#6B7A90">근접연산·자사 디바이스 통합(2단계 이관) · 클러스터 규모 N 조정(고정 N 전제) · 모델 학습(R-22) — 근거: 요구사항 분석 v1.7 §3.1·§3.2 (vLLM은 소싱 의존[DP1]이라 제외)</text>
</svg>
