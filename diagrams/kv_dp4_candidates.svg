<svg viewBox="0 0 1400 1010" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1F2A44"/>
    </marker>
    <marker id="arrRed4" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#B3402A"/>
    </marker>
    <marker id="arrGrn4" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B7A4B"/>
    </marker>
    <marker id="arrAmb4" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#B45309"/>
    </marker>
  </defs>

  <text x="44" y="36" font-size="20" font-weight="700" fill="#1F2A44">DP4. 정확도를 유지한 KV 캐시 압축 — 후보구조 설계도</text>
  <text x="44" y="57" font-size="11.5" fill="#6B7A90">확정안 v2 패키지 구조(Memory Engine 중심) 위에서 pruning 집행 시점·자산 표현만 다름 — 주황: 신설 컴포넌트 · Memory Compressor는 양쪽 모두 mechanism 전담(v2)</text>

  <line x1="700" y1="72" x2="700" y2="880" stroke="#C9D2DE" stroke-width="1"/>

  <!-- ================= LEFT: 후보1 eager single-copy ================= -->
  <rect x="40" y="76" width="620" height="30" fill="#DCE3EE" stroke="#44546A" stroke-width="1.2"/>
  <text x="52" y="96" font-size="13.5" font-weight="700" fill="#1F2A44">후보구조 1 — 입장 시 고정 예산·단일 사본형 (eager, 파괴적)</text>

  <rect x="60" y="124" width="580" height="110" fill="#F4F6FA" stroke="#44546A" stroke-width="1.2"/>
  <text x="74" y="146" font-size="12" font-weight="700" fill="#1F2A44">«MCR» Inference Engine</text>
  <rect x="84" y="160" width="250" height="54" fill="#FFFFFF" stroke="#44546A" stroke-width="1.2"/>
  <text x="96" y="182" font-size="11.5" font-weight="700" fill="#1F2A44">Step Execution Controller</text>
  <text x="96" y="200" font-size="9.5" fill="#6B7A90">prefill 완료 시점</text>
  <line x1="209" y1="234" x2="209" y2="266" stroke="#1F2A44" stroke-width="1.8" marker-end="url(#arr4)"/>
  <text x="220" y="256" font-size="10.5" fill="#1F2A44">prefill 종료 KV (1회 통과)</text>

  <rect x="60" y="270" width="580" height="370" fill="#F4F6FA" stroke="#44546A" stroke-width="1.2"/>
  <text x="74" y="292" font-size="12" font-weight="700" fill="#1F2A44">«MCR» Memory Engine</text>
  <rect x="84" y="306" width="532" height="180" fill="#FFFFFF" stroke="#7A8699" stroke-width="1"/>
  <text x="96" y="324" font-size="11" font-weight="700" fill="#1F2A44">«package» Cache Manager</text>
  <rect x="104" y="338" width="256" height="76" fill="#FDF6E9" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="116" y="358" font-size="11.5" font-weight="700" fill="#8A5A08">Prefill-exit Pruner (신설)</text>
  <text x="116" y="376" font-size="9.5" fill="#8A5A08">훅 1점 — 전역 예산(예: 토큰 20%)</text>
  <text x="116" y="391" font-size="9.5" fill="#8A5A08">중요도 판정·확정 집행, 재평가 없음</text>
  <rect x="384" y="338" width="212" height="76" fill="#FFFFFF" stroke="#44546A" stroke-width="1.2"/>
  <text x="396" y="358" font-size="11.5" font-weight="700" fill="#1F2A44">Memory Compressor</text>
  <text x="396" y="376" font-size="9.5" fill="#6B7A90">mechanism 집행 전담</text>
  <line x1="360" y1="376" x2="380" y2="376" stroke="#1F2A44" stroke-width="1.4" marker-end="url(#arr4)"/>
  <rect x="104" y="426" width="492" height="46" fill="#FFFFFF" stroke="#44546A" stroke-width="1.2"/>
  <text x="116" y="444" font-size="11" font-weight="700" fill="#1F2A44">KV Index — 단일 사본(pruned)만 지시</text>
  <text x="116" y="462" font-size="9.5" fill="#6B7A90">원본 없음 — 예산·알고리즘이 자산에 각인</text>

  <rect x="84" y="500" width="532" height="70" fill="#FFFFFF" stroke="#7A8699" stroke-width="1"/>
  <text x="96" y="518" font-size="11" font-weight="700" fill="#1F2A44">«package» Tier &amp; Lifecycle</text>
  <rect x="104" y="526" width="492" height="36" fill="#FFFFFF" stroke="#44546A" stroke-width="1.2"/>
  <text x="116" y="549" font-size="10.5" fill="#1F2A44">Migration — 저장·강등·영속·재사용 로드 전부 pruned 사본 (전 경로 경량)</text>
  <text x="84" y="600" font-size="10.5" font-weight="700" fill="#B3402A">재사용 hit의 잔여물 = 과거 쿼리 기준 pruned KV — 미래 쿼리 회복 수단 없음</text>
  <text x="84" y="622" font-size="10" fill="#6B7A90">Tiered KV Store [ HBM | DRAM | SSD ] — 모든 tier에 pruned 사본만 존재</text>

  <text x="60" y="672" font-size="10.5" font-weight="700" fill="#1B7A4B">이득: 전 경로가 예산 비율만큼 경량 — 산술 5× 용량 (QA4) · decode 읽기량 즉감 (QA1) · 구조 최소(훅 1·사본 1)</text>
  <text x="60" y="692" font-size="10.5" font-weight="700" fill="#B3402A">제약: 불가역 — 재사용 요청의 ΔF1 bound 보장 실패 리스크 (QA2, pruning×재사용 충돌 정면) · 기법 교체 시 전 자산 재생성 (QA5)</text>
  <text x="60" y="720" font-size="10" fill="#6B7A90">보완 필수(채택 시): 재사용 태그 KV의 보수 예산 규칙 — 중재 주체는 DP2 채택안</text>

  <!-- ================= RIGHT: 후보2 adaptive dual ================= -->
  <rect x="710" y="76" width="650" height="30" fill="#DCE3EE" stroke="#44546A" stroke-width="1.2"/>
  <text x="722" y="96" font-size="13.5" font-weight="700" fill="#1F2A44">후보구조 2 — 수명주기 적응·이중 표현형 (adaptive, 가역)</text>

  <rect x="730" y="124" width="610" height="70" fill="#F4F6FA" stroke="#44546A" stroke-width="1.2"/>
  <text x="744" y="146" font-size="12" font-weight="700" fill="#1F2A44">«MCR» Inference Orchestration</text>
  <rect x="754" y="156" width="280" height="30" fill="#FFFFFF" stroke="#44546A" stroke-width="1"/>
  <text x="766" y="176" font-size="10.5" font-weight="700" fill="#1F2A44">SLO / QoS Monitor — 품질 telemetry</text>
  <text x="1050" y="176" font-size="9.5" fill="#6B7A90">요청별 품질 예산 힌트 하향 (소재는 DP2)</text>

  <rect x="730" y="220" width="610" height="420" fill="#F4F6FA" stroke="#44546A" stroke-width="1.2"/>
  <text x="744" y="242" font-size="12" font-weight="700" fill="#1F2A44">«MCR» Memory Engine</text>
  <rect x="754" y="256" width="562" height="160" fill="#FFFFFF" stroke="#7A8699" stroke-width="1"/>
  <text x="766" y="274" font-size="11" font-weight="700" fill="#1F2A44">«package» Cache Manager</text>
  <rect x="774" y="288" width="280" height="90" fill="#FDF6E9" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="786" y="308" font-size="11.5" font-weight="700" fill="#8A5A08">Lifecycle Pruning Manager (신설)</text>
  <text x="786" y="326" font-size="9.5" fill="#8A5A08">· 수명주기 훅 분산: 생성→영속→재사용→재평가</text>
  <text x="786" y="341" font-size="9.5" fill="#8A5A08">· 요청별 품질 예산 → view 예산 결정</text>
  <text x="786" y="356" font-size="9.5" fill="#8A5A08">· 품질 피드백(FR-07)으로 예산 재조정</text>
  <rect x="1074" y="288" width="242" height="90" fill="#FFFFFF" stroke="#44546A" stroke-width="1.2"/>
  <text x="1086" y="308" font-size="11.5" font-weight="700" fill="#1F2A44">Memory Compressor</text>
  <text x="1086" y="326" font-size="9.5" fill="#6B7A90">mechanism 집행 전담</text>
  <line x1="1054" y1="330" x2="1070" y2="330" stroke="#1F2A44" stroke-width="1.4" marker-end="url(#arr4)"/>

  <rect x="754" y="432" width="562" height="52" fill="#FDF6E9" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="766" y="452" font-size="11.5" font-weight="700" fill="#8A5A08">KV Index — 이중 표현 (확장): 원본 ↔ 파생 pruned view</text>
  <text x="766" y="470" font-size="9.5" fill="#8A5A08">요청은 예산에 맞는 view로, 미래 쿼리·재사용은 원본에서 재파생 (가역)</text>

  <rect x="754" y="500" width="562" height="118" fill="#FFFFFF" stroke="#7A8699" stroke-width="1"/>
  <text x="766" y="518" font-size="11" font-weight="700" fill="#1F2A44">«package» Tier &amp; Lifecycle</text>
  <rect x="774" y="530" width="256" height="70" fill="#EAF1E7" stroke="#1B7A4B" stroke-width="1.2"/>
  <text x="786" y="550" font-size="10.5" font-weight="700" fill="#155F3B">상위 tier (HBM/DRAM)</text>
  <text x="786" y="568" font-size="9.5" fill="#155F3B">파생 pruned view 상주 —</text>
  <text x="786" y="583" font-size="9.5" fill="#155F3B">decode 읽기량은 후보1과 동등</text>
  <rect x="1060" y="530" width="256" height="70" fill="#EDEFF4" stroke="#1F3864" stroke-width="1.2"/>
  <text x="1072" y="550" font-size="10.5" font-weight="700" fill="#1F3864">하위 tier (SSD)</text>
  <text x="1072" y="568" font-size="9.5" fill="#1F3864">원본 보존 — 파괴 대신 강등</text>
  <text x="1072" y="583" font-size="9.5" fill="#1F3864">(Migration이 강등 수행)</text>
  <line x1="1056" y1="556" x2="1034" y2="556" stroke="#B45309" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arrAmb4)"/>
  <text x="1000" y="548" font-size="9" fill="#8A5A08">파생</text>

  <path d="M 894 186 L 894 216" fill="none" stroke="#6B7A90" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arr4)"/>
  <text x="904" y="210" font-size="9.5" fill="#6B7A90">품질 피드백 루프 (FR-07)</text>

  <text x="730" y="672" font-size="10.5" font-weight="700" fill="#1B7A4B">이득: 가역 — 요청별 ΔF1 bound 집행, pruning×재사용 충돌을 구조로 해소 (QA2) · 알고리즘 교체 = 파생 재생성만 (QA5)</text>
  <text x="730" y="692" font-size="10.5" font-weight="700" fill="#B3402A">제약: 이중 사본이 하위 tier 용량 잠식 + 원본–파생 정합성 관리 (QA4) · view 생성·재평가 연산의 피크 잠식 (QA1)</text>
  <text x="730" y="720" font-size="10" fill="#6B7A90">DP3 커플링: 원본 보존이 선택 재계산(DP3)의 품질 상한을 보존 — 검토 노트: 재사용 태그만 이중 표현하는 hybrid 유력</text>

  <!-- legend -->
  <rect x="44" y="966" width="22" height="14" fill="#FDF6E9" stroke="#B45309" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="74" y="978" font-size="10.5" fill="#1F2A44">신설/확장 컴포넌트</text>
  <line x1="240" y1="972" x2="290" y2="972" stroke="#1F2A44" stroke-width="1.8" marker-end="url(#arr4)"/>
  <text x="298" y="978" font-size="10.5" fill="#1F2A44">의존 («use»)</text>
  <line x1="420" y1="972" x2="470" y2="972" stroke="#B45309" stroke-width="1.6" stroke-dasharray="7,5" marker-end="url(#arrAmb4)"/>
  <text x="478" y="978" font-size="10.5" fill="#1F2A44">파생 생성 흐름</text>
  <line x1="620" y1="972" x2="670" y2="972" stroke="#6B7A90" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arr4)"/>
  <text x="678" y="978" font-size="10.5" fill="#1F2A44">telemetry/피드백</text>
  <rect x="820" y="966" width="22" height="14" fill="#EAF1E7" stroke="#1B7A4B" stroke-width="1.2"/>
  <text x="850" y="978" font-size="10.5" fill="#1F2A44">파생 view 상주 tier</text>
  <rect x="1000" y="966" width="22" height="14" fill="#EDEFF4" stroke="#1F3864" stroke-width="1.2"/>
  <text x="1030" y="978" font-size="10.5" fill="#1F2A44">원본 보존 tier</text>
</svg>
