<svg viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <text x="30" y="34" font-size="19" font-weight="700" fill="#1F2A44">전체 AI SW 스택</text>
  <text x="30" y="56" font-size="11.5" fill="#6B7A90">초록 강조 = 본 과제가 다루는 런타임 계층</text>

  <!-- Application -->
  <rect x="40" y="80" width="620" height="90" fill="#F4F6FA" stroke="#44546A" stroke-width="1.2"/>
  <text x="60" y="116" font-size="15" font-weight="700" fill="#1F2A44">AI 서비스 / Application</text>
  <text x="60" y="140" font-size="11.5" fill="#6B7A90">chatbot · agent · RAG 서비스 — long-context · multiturn 워크로드의 원천</text>

  <!-- Model -->
  <rect x="40" y="182" width="620" height="80" fill="#F4F6FA" stroke="#44546A" stroke-width="1.2"/>
  <text x="60" y="214" font-size="15" font-weight="700" fill="#1F2A44">Model (LLM)</text>
  <text x="60" y="238" font-size="11.5" fill="#6B7A90">Transformer 계열 — KV cache를 만드는 주체 (C-02)</text>

  <!-- Serving Runtime (OURS) -->
  <rect x="32" y="274" width="636" height="176" fill="#EAF1E7" stroke="#1B7A4B" stroke-width="3.4"/>
  <text x="60" y="308" font-size="16" font-weight="700" fill="#155F3B">AI 추론 서빙 런타임  ← 본 과제 영역</text>
  <rect x="56" y="326" width="186" height="98" fill="#FFFFFF" stroke="#4E7C3A" stroke-width="1.2"/>
  <text x="68" y="352" font-size="12" font-weight="700" fill="#1F2A44">Inference</text>
  <text x="68" y="368" font-size="12" font-weight="700" fill="#1F2A44">Orchestration</text>
  <text x="68" y="390" font-size="10" fill="#6B7A90">admission · 라우팅</text>
  <text x="68" y="406" font-size="10" fill="#6B7A90">스케줄링 · autoscale</text>
  <rect x="258" y="326" width="186" height="98" fill="#FFFFFF" stroke="#4E7C3A" stroke-width="1.2"/>
  <text x="270" y="352" font-size="12" font-weight="700" fill="#1F2A44">Inference Engine</text>
  <text x="270" y="376" font-size="10" fill="#6B7A90">batching · 실행</text>
  <text x="270" y="392" font-size="10" fill="#6B7A90">attention/kernel</text>
  <rect x="460" y="326" width="186" height="98" fill="#FFFFFF" stroke="#4E7C3A" stroke-width="1.2"/>
  <text x="472" y="352" font-size="12" font-weight="700" fill="#1F2A44">Memory Engine</text>
  <text x="472" y="376" font-size="10" fill="#6B7A90">KV cache 관리</text>
  <text x="472" y="392" font-size="10" fill="#6B7A90">재사용·압축·배치</text>

  <!-- Framework -->
  <rect x="40" y="462" width="620" height="80" fill="#F4F6FA" stroke="#44546A" stroke-width="1.2"/>
  <text x="60" y="494" font-size="15" font-weight="700" fill="#1F2A44">ML Framework / Kernel Library</text>
  <text x="60" y="518" font-size="11.5" fill="#6B7A90">PyTorch · CUDA · FlashAttention/FlashInfer</text>

  <!-- System SW -->
  <rect x="40" y="554" width="620" height="80" fill="#F4F6FA" stroke="#44546A" stroke-width="1.2"/>
  <text x="60" y="586" font-size="15" font-weight="700" fill="#1F2A44">System SW</text>
  <text x="60" y="610" font-size="11.5" fill="#6B7A90">OS · driver · container/K8s</text>

  <!-- HW -->
  <rect x="40" y="646" width="620" height="130" fill="#EDEFF4" stroke="#1F3864" stroke-width="1.2"/>
  <text x="60" y="678" font-size="15" font-weight="700" fill="#1F2A44">Hardware</text>
  <rect x="60" y="694" width="180" height="60" fill="#FFFFFF" stroke="#7A8699" stroke-width="1"/>
  <text x="76" y="720" font-size="11.5" font-weight="700" fill="#1F2A44">GPU (연산)</text>
  <rect x="260" y="694" width="180" height="60" fill="#FFFFFF" stroke="#7A8699" stroke-width="1"/>
  <text x="276" y="714" font-size="11.5" font-weight="700" fill="#1F2A44">Memory</text>
  <text x="276" y="732" font-size="9.5" fill="#6B7A90">HBM · DRAM</text>
  <rect x="460" y="694" width="180" height="60" fill="#FFFFFF" stroke="#7A8699" stroke-width="1"/>
  <text x="476" y="714" font-size="11.5" font-weight="700" fill="#1F2A44">Storage</text>
  <text x="476" y="732" font-size="9.5" fill="#6B7A90">NVMe SSD</text>

  <text x="40" y="812" font-size="11.5" fill="#155F3B" font-weight="700">본 과제: 런타임 계층에서 KV cache의 생성·저장·이동·재사용을 최적 운용</text>
  <text x="40" y="834" font-size="11" fill="#6B7A90">모델·framework·HW는 주어진 조건 (C-01 디바이스 불변 · C-02 Transformer · C-03 training-free)</text>

  <!-- zoom cue -->
  <path d="M 668 286 L 692 286" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M 668 442 L 692 442" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6,4"/>
</svg>
